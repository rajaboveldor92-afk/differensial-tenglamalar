<!doctype html>
<!-- Build-time page: renders one video slide at 1280x720 for tools/video/build.py. Not shipped in the APK. -->
<html lang="uz" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/video-fix.css">
<style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f6f2e9}#s{width:1280px;height:720px}.slide{height:720px;font-size:30px;padding:80px 80px 40px}.slide-math{font-size:1.5em}.slide-head{font-size:18px}.slide-plot canvas{max-height:430px}</style>
</head><body><div id="s"></div>
<script src="vendor/katex/katex.min.js"></script><script src="js/i18n.js"></script><script src="js/core.js"></script><script src="js/mathtext.js"></script>
<script src="js/expr.js"></script><script src="js/ode.js"></script><script src="js/plot.js"></script><script src="js/content-index.js"></script><script src="js/video.js"></script><script src="js/video-clean.js"></script>
<script>
document.documentElement.dataset.theme = 'light';
window.renderSlide = function (topic, partIdx, seg, lang) {
  DT.state.settings.lang = lang;
  return DT.loadVideo(topic).then(v => { const part = Object.assign({ topic }, v.parts[partIdx]); const host = document.getElementById('s'); host.innerHTML = '';
    host.appendChild(DT.renderSlide(part.segments[seg].show, part, lang)); return new Promise(r => setTimeout(r, 250)); });
};
</script></body></html>
