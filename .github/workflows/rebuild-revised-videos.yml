name: Rebuild revised video lessons

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/video-content-audit-2026-10-16
    paths:
      - '.github/workflows/rebuild-revised-videos.yml'
      - 'tools/video/neural_espeak_shim.py'
      - 'tools/video/dump.js'
      - 'web/js/video-full.js'
      - 'web/js/video-clean.js'
      - 'web/css/video-fix.css'
      - 'web/content/t*.js'
      - 'web/index.html'
      - 'web/slide.html'

jobs:
  build:
    name: build-${{ matrix.topic }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        topic: [t01, t02, t03, t04, t05, t06, t07, t08, t09, t10, t11, t12, t13, t14, t15, tL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render and neural voice dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip edge-tts
          sudo npm install --prefix /opt/node-tools playwright
          sudo /opt/node-tools/node_modules/.bin/playwright install-deps chromium
          /opt/node-tools/node_modules/.bin/playwright install chromium
      - name: Use female neural voices
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tts-bin"
          cat > "$GITHUB_WORKSPACE/.tts-bin/espeak-ng" <<'EOF'
          #!/usr/bin/env bash
          exec python3 "$GITHUB_WORKSPACE/tools/video/neural_espeak_shim.py" "$@"
          EOF
          chmod +x "$GITHUB_WORKSPACE/.tts-bin/espeak-ng"
          echo "$GITHUB_WORKSPACE/.tts-bin" >> "$GITHUB_PATH"
      - name: Validate full lesson scripts
        run: |
          node tools/video/dump.js > /tmp/video-scripts.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/video-scripts.json'))
          for topic,v in d.items():
              assert v.get('full') is True, topic
              assert v.get('parts'), topic
              assert all(p.get('segments') for p in v['parts']), topic
          print('topics=',len(d),'parts=',sum(len(v['parts']) for v in d.values()),'segments=',sum(len(p['segments']) for v in d.values() for p in v['parts']))
          PY
      - name: Start lesson server
        run: |
          python3 -m http.server 8765 -d web >/tmp/dt-video-http.log 2>&1 &
          echo $! > /tmp/dt-video-http.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:8765/slide.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dt-video-http.log
          exit 1
      - name: Render ${{ matrix.topic }} full lesson in Uzbek, Russian and English
        run: |
          python3 tools/video/build.py \
            --topics '${{ matrix.topic }}' \
            --bundle '' \
            --out 'dist/revised/${{ matrix.topic }}' \
            --quals 480,720 \
            --langs uz,ru,en
      - name: Verify outputs
        run: |
          set -euo pipefail
          parts=$(node tools/video/dump.js | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['${{ matrix.topic }}']['parts']))")
          expected_mp4=$((parts * 3 * 2))
          expected_vtt=$((parts * 3 * 3))
          expected_txt=$((parts * 3))
          count_mp4=$(find 'dist/revised/${{ matrix.topic }}' -type f -name '*.mp4' | wc -l)
          count_vtt=$(find 'dist/revised/${{ matrix.topic }}' -type f -name '*.vtt' | wc -l)
          count_txt=$(find 'dist/revised/${{ matrix.topic }}' -type f -name '*-transcript.txt' | wc -l)
          echo "parts=$parts mp4=$count_mp4/$expected_mp4 vtt=$count_vtt/$expected_vtt transcript=$count_txt/$expected_txt"
          test "$count_mp4" -eq "$expected_mp4"
          test "$count_vtt" -eq "$expected_vtt"
          test "$count_txt" -eq "$expected_txt"
          first_mp4=$(find 'dist/revised/${{ matrix.topic }}' -type f -name '*-720.mp4' | head -n 1)
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 "$first_mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: full-lesson-${{ matrix.topic }}-uz-ru-en-480-720
          path: dist/revised/${{ matrix.topic }}/
          if-no-files-found: error
          retention-days: 7
