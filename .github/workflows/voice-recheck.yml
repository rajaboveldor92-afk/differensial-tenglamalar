name: Voice recheck

on:
  push:
    branches:
      - claude/voice-review
    paths:
      - '.github/workflows/voice-recheck.yml'
      - 'tools/video/voice_recheck.py'

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck doubtful sentences
        run: |
          mkdir -p /tmp/store
          (
            set -euxo pipefail
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
            python3 -m pip install -q faster-whisper
            git clone -q --depth 1 -b video-packs "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/packs
            node tools/video/dump.js > /tmp/scripts.json
            python3 tools/video/voice_recheck.py /tmp/packs/video /tmp/scripts.json /tmp/store/recheck.jsonl \
              v11b-ru-3-1 v11b-ru-3-2 v14a-ru-4-0 v01b-en-3-3 v09a-uz-3-0 v02b-uz-3-0 v15a-ru-3-2
          ) > /tmp/store/recheck-log.txt 2>&1 || tail -40 /tmp/store/recheck-log.txt
      - name: Push results
        if: always()
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b voice-review-results "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/res
          cp /tmp/store/* /tmp/res/
          cd /tmp/res
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -q -m "Voice recheck" && git push -q origin voice-review-results
