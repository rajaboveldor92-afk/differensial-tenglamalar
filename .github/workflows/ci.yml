name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  math-and-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/test-ode.js
      - run: node tools/test-expr.js
      - run: node tools/validate.js web/content/t*.js

  android-api36:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build signed test APK
        env:
          ANDROID_PLATFORM_API: '36'
          ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
        run: bash android/build.sh test
      - name: Verify target SDK and signature
        run: |
          set -euo pipefail
          APK="$(find dist -maxdepth 1 -name '*-test.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "targetSdkVersion:'36'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: differensial-tenglamalar-test-apk
          path: dist/*-test.apk
          if-no-files-found: error
          retention-days: 7
